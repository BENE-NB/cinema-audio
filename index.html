<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小岛经济学·经济故事卡</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#38291f}body{background:#f3ead8;background-image:radial-gradient(#d8c5a5 1px,transparent 1px);background-size:18px 18px}.app{width:min(100%,1060px);min-height:100vh;margin:auto;padding:22px clamp(12px,4vw,42px)}header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.tag{color:#a24e2d;font-size:12px;font-weight:800;letter-spacing:.12em}h1{font-family:KaiTi,STKaiti,serif;font-size:clamp(22px,4vw,36px);margin:5px 0 0}.count{background:#3e2d24;color:#fff;border-radius:22px;padding:8px 13px;box-shadow:3px 3px #cfb78d}.count b{color:#ffd76d;font-size:18px}.card{background:#fffaf0;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px #61452126,0 3px #d6c29f;animation:enter .35s both}@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}.art{height:clamp(340px,52vh,680px);position:relative;background:#c99d6b;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover;display:block}.shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,#35231655)}.label,.concept{position:absolute;border-radius:99px;font-weight:900;backdrop-filter:blur(8px)}.label{left:15px;bottom:14px;background:#fff8eeee;padding:8px 14px;font-size:12px}.concept{right:14px;top:14px;background:#3c2b23df;color:#ffe19a;padding:8px 13px;font-size:11px}.body{padding:clamp(20px,4vw,38px);align-self:center;max-height:760px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.head>span{color:#9b5834;font-size:12px;font-weight:900;letter-spacing:.14em}.audio{border:0;border-radius:99px;padding:10px 14px;background:#eee0c8;color:#73462f;font-weight:800;cursor:pointer}.audio.playing{background:#e86d3b;color:white;box-shadow:0 0 0 6px #e86d3b22;animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.04)}}.narration{font-family:KaiTi,STKaiti,serif;font-size:clamp(17px,2.1vw,21px);line-height:1.82;margin:0;transition:.25s}.narration.active{background:#fff0c8;border-radius:14px;padding:10px 12px;margin:-10px -12px}.dialogues{display:grid;gap:10px;margin-top:18px}.dialogue{display:flex;gap:12px;align-items:flex-start;background:#f2e6d1;border-left:5px solid #e86d3b;border-radius:4px 17px 17px 4px;padding:14px;transition:.25s}.dialogue:nth-child(even){background:#eaf2e7;border-left-color:#4f8c78}.dialogue.active{transform:translateX(3px);box-shadow:0 0 0 4px #e86d3b22}.dialogue>i{font-style:normal;font-size:31px}.dialogue strong{font-size:12px;color:#a0522d}.dialogue p{margin:4px 0 0;font-size:14px;font-weight:700;line-height:1.62;color:#70452e}footer{margin-top:18px}.dots{display:flex;justify-content:center;gap:8px;margin-bottom:13px}.dot{border:0;width:28px;height:28px;border-radius:50%;background:#dfceb1;color:#8b775e;font-size:11px;font-weight:900;cursor:pointer}.dot.active{width:40px;border-radius:16px;background:#e86d3b;color:white}.dot.done{background:#82ac89;color:white}.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.nav button{border:0;border-radius:14px;padding:12px 17px;background:#fff9ec;color:#574639;font-weight:800;box-shadow:0 3px #cdb99a;cursor:pointer}.nav button:last-child{justify-self:end;background:#3e2d24;color:white}.nav button:disabled{opacity:.35}.nav p{font-size:11px;color:#97836a;margin:0 15px}@media(min-width:760px){.card{display:grid;grid-template-columns:48% 1fr;min-height:700px}.art{height:auto;min-height:100%}}@media(max-width:600px){.app{padding:15px 11px 22px}h1{font-size:21px}.art{height:350px}.body{padding:18px 16px;max-height:none;overflow:visible}.nav{grid-template-columns:1fr 1fr}.nav p{display:none}.label{font-size:10px;max-width:76%}.concept{font-size:9px}}
</style></head><body><div class="app"><header><div><div class="tag">小岛经济学 · 第一季</div><h1>从徒手捕鱼到生产力爆发</h1></div><div class="count"><b id="num">01</b> / 07</div></header><main id="card" class="card"></main><footer><div id="dots" class="dots"></div><div class="nav"><button id="prev">← 上一幕</button><p id="hint">左右滑动也能翻页</p><button id="next">下一幕 →</button></div></footer></div><script>
const A='./cinema-audio/';const cards=[
{t:'烈日下的“手停口停”',c:'稀缺',n:'在很久很久以前，这座小岛上什么都没有。大毛每天唯一的任务，就是站在冰冷的海水里，用自己毛茸茸的双手去抓鱼。这里的鱼游得比闪电还快，大毛从天亮站到天黑，皮肤都被海水泡得发白了。孩子们，这就叫“稀缺”。岛上的鱼是有限的，大毛的体力和时间也是有限的。他没有任何工具，只能靠出卖苦力去和生存赛跑。',a:'card-1-narration.mp3',d:[['大毛','呼……呼……今天运气太差了，已经滑走三条了。我的腰酸得都快直不起来了，如果今天抓不到，晚上就要饿肚子了……再来一次！','card-1-damao.mp3']]},
{t:'晚风中的肚子咕噜叫',c:'储蓄与风险',n:'辛辛苦苦一整天，大毛终于抓到了一条鱼。他太饿了，一眨眼就把鱼吃光了。可是，一条鱼只能让他勉强不被饿死，他根本没有多余的鱼存下来。如果没有储蓄，生活就会充满危机。',a:'card-2-narration.mp3',d:[['大毛','阿哲，我吃完了，可我还是好饿啊！而且我一想到明天天一亮，我还得去海水里泡一天，我这心里就直发慌。万一哪天我生病了起不来床，我是不是就要被活活饿死了？','card-2-damao.mp3'],['阿哲','大毛，这就叫“手停口停”！只要你的双手停下来，你的嘴巴就要挨饿。我们不能一辈子当一头只会用手抓鱼的傻熊，我们必须改变！','card-2-azhe.mp3']]},
{t:'篝火旁的“天才计划”',c:'投资风险',n:'想要未来的好工具，就必须牺牲眼前的晚饭。大毛面临着巨大的“投资风险”——万一藤蔓网做失败了，或者织好了根本抓不到鱼，那他这一天的肚子，可就白白挨饿了。这就是最难的选择。',a:'card-3-narration.mp3',d:[['阿哲','大毛！我想到了！如果我们把岛上的藤蔓编织在一起，做成一个大网，往海里一撒，是不是就能一次抓很多条鱼？这叫“工具”！','card-3-azhe.mp3'],['大毛','织网？那得花整整一天时间！如果我明天去编织这个什么网，那我明天就一条鱼都吃不到，我必须死扛一整天的饥饿！万一失败了，我不是白挨饿了吗？','card-3-damao.mp3']]},
{t:'黑夜里的汗水与死撑',c:'延迟满足',n:'大毛死死咬着牙，眼泪在眼眶里打转，但他没有停下手里的活。财富的底色，从来不是轻松的魔法，而是黑夜里的汗水、忍耐与坚持。这在经济学里，叫做“延迟满足”。',a:'card-4-narration.mp3',d:[['大毛','好饿……饿得眼睛都要冒绿光了……树皮好硬，把我的手磨得好疼。阿哲，我真的想放弃了，我现在把藤蔓扔了，跑去海里抓条鱼吃还来得及吗？','card-4-damao.mp3'],['阿哲','大毛，撑住！再打三个结就掉不下来了！想想看，现在的痛苦，是为了以后天天能吃大饱！厉害的人，都能忍住眼前的痛苦！','card-4-azhe.mp3']]},
{t:'第一网的失败与技术吃瘪',c:'投资失败',n:'糟糕！大鱼全都跑光了！任何新技术的发明都不可能一帆风顺，这就是真实的“投资失败与技术风险”。这时候，是放弃换回老办法，还是找出原因继续死磕，决定了谁才能成为真正的企业家。',a:'card-5-narration.mp3',d:[['大毛','怎么会这样……鱼都跑了。阿哲，网破了！我手都磨破了，挨了一整天的饿，结果连个鱼鳞都没捞着。我是不是个笨蛋？我不做了！我要去用手抓鱼！','card-5-damao.mp3'],['阿哲','大毛，别哭！你看这里，因为你昨天太饿太累了，后面的几个结打得太松，网眼太大了，大鱼一钻就破了！这不是失败，这是学费！我们找到问题，把它改掉！','card-5-azhe.mp3']]},
{t:'沙滩上的“技术升级”',c:'技术升级',n:'大毛没有放弃。他饿着肚子，坐在沙滩上重新改装他的工具。这一次，他把网眼编得更密，把绳结打得更牢。孩子们，这就是“技术升级”。财富不仅来自一个好点子，更来自面对失败时，不断修改和优化的能力。',a:'card-6-narration.mp3',d:[['大毛','刚才大鱼是从这个洞钻走的，我这次把它封死！我就不信抓不到你们！再试一次！','card-6-damao.mp3']]},
{t:'天亮了！生产力的大爆发！',c:'生产力',n:'天亮了！有了改良版渔网的大毛，一网竟然抓到了五条大鱼！以前他用手抓，一天只能抓一条，刚好够吃；现在有了渔网，他一天能抓五条！不仅今天能吃饱，还多出了四条鱼！孩子们，多出来的鱼就是大毛的“储蓄”。更厉害的是，渔网帮大毛赚到了岛上最宝贵的东西——不用干活的自由时间。他可以用这个时间去干更伟大的事情了！',a:'card-7-narration.mp3',d:[['大毛','一、二、三、四、五！五条！成功了！阿哲，原来光靠埋头苦干是不行的，开动脑筋做出聪明的工具并不断改进，才能让我们干活变轻松，多赚大鱼！','card-7-damao.mp3']]}
];let page=0,player=null,token=0,startX=0,playing=false,segment=0;const card=document.querySelector('#card'),dots=document.querySelector('#dots'),prev=document.querySelector('#prev'),next=document.querySelector('#next');function stop(){token++;if(player){player.pause();player=null}playing=false;segment=0}function render(){stop();const c=cards[page];document.querySelector('#num').textContent=String(page+1).padStart(2,'0');card.innerHTML=`<div class="art"><img src="./cinema-art/card-${page+1}.webp"><div class="shade"></div><div class="concept">本幕关键词 · ${c.c}</div><div class="label">第 ${page+1} 幕 · ${c.t}</div></div><section class="body"><div class="head"><span id="speaker">故事旁白</span><button id="audio" class="audio">▶ 听完整故事</button></div><p class="narration" id="narration">${c.n}</p><div class="dialogues">${c.d.map((d,i)=>`<div class="dialogue" id="d${i}"><i>${d[0]==='大毛'?'🐻':'🦉'}</i><div><strong>${d[0]}</strong><p>${d[1]}</p></div></div>`).join('')}</div></section>`;document.querySelector('#audio').onclick=playStory;prev.disabled=page===0;next.disabled=page===6;next.textContent=page===6?'本章完成':'下一幕 →';document.querySelector('#hint').textContent=page===6?'第一章 · 完':'左右滑动也能翻页';dots.innerHTML=cards.map((_,i)=>`<button class="dot ${i===page?'active':i<page?'done':''}" data-i="${i}">${i<page?'✓':i+1}</button>`).join('');dots.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}function playFile(src,t){return new Promise((resolve,reject)=>{if(t!==token)return resolve();player=new Audio(A+src);player.onended=resolve;player.onerror=reject;player.play().catch(reject)})}async function playStory(){if(playing){stop();render();return}playing=true;const t=++token,c=cards[page],seq=[[c.a,'n'],...c.d.map((d,i)=>[d[2],i])],btn=document.querySelector('#audio');btn.classList.add('playing');btn.textContent='■ 正在演播';try{for(const [src,s] of seq){if(t!==token)return;document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));if(s==='n'){document.querySelector('#narration').classList.add('active');document.querySelector('#speaker').textContent='故事旁白'}else{document.querySelector('#d'+s).classList.add('active');document.querySelector('#speaker').textContent=c.d[s][0]}await playFile(src,t)}}catch(e){console.error(e)}finally{if(t===token){playing=false;player=null;render()}}}function go(i){if(i<0||i>6)return;page=i;render();scrollTo({top:0,behavior:'smooth'})}prev.onclick=()=>go(page-1);next.onclick=()=>go(page+1);card.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>65)go(page+(dx<0?1:-1))},{passive:true});render();
</script></body></html>
